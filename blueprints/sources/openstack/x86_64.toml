# Platform: openstack — x86_64
# Canonical source: https://github.com/coreos/fedora-coreos-config/blob/testing-devel/platforms.yaml
[customizations.kernel]
# The OpenStack build omits image-builder's default kernel arguments so
# its console defaults cannot override this order. Preserve rw explicitly.
append = "rw ignition.platform.id=openstack console=ttyS0,115200n8 console=tty0"

[customizations.bootloader.grub2]
terminal_input = ["serial", "console"]
terminal_output = ["serial", "console"]
serial = "serial --speed=115200"
